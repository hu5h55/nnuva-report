[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nnuva-report"
version = "5.7.0"
description = "NNUVA Interactive Dashboard Generator"
authors = [{name = "Nic"}]
requires-python = ">=3.7"
dependencies = []

[project.scripts]
nnuva-report = "nnuva_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nnuva_report = ["templates/*"]
